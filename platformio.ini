; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Tools > USB Type: "Dual Serial"
;   Serial     — repeater byte pump (PC <-> downstream USB CDC device)
;   SerialUSB1 — command/control port (GAACE commandProcessor)
; GAACE_THREAD_CMDS enables GAACE_Core's threadCommands module (TLIST, ...).
build_flags =
    -D USB_DUAL_SERIAL
    -D GAACE_THREAD_CMDS

upload_protocol = teensy-cli

; Sets the composite device's USB Manufacturer/Product strings — Teensyduino's
; teensy platform has no board_build.usb_product/usb_manufacturer option like
; the SAMD platform does, so this patches the shared framework source in
; place at build time. See scripts/patch_usb_desc.py for details/caveats.
extra_scripts = pre:scripts/patch_usb_desc.py

lib_deps =
    https://github.com/GordonAnderson/GAACE_Core.git
    https://github.com/GordonAnderson/ArduinoThread.git
    https://github.com/GordonAnderson/GAACE_Script.git
