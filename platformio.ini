; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Tools > USB Type: "Triple Serial"
;   Serial     — repeater byte pump #1 (PC <-> downstream USB CDC device, SDEV,<n>)
;   SerialUSB1 — command/control port (GAACE commandProcessor)
;   SerialUSB2 — repeater byte pump #2 (PC <-> a DIFFERENT downstream device, SDEV2,<n>)
;                ActiveDevice/ActiveDevice2 are kept mutually exclusive (see
;                USBrepeater.h) -- ports 1-4 of the 7 usable i.MXRT1062 USB
;                endpoints beyond EP0 go to these 3 CDC ports (2 each); no
;                endpoint budget remains for a 4th.
; GAACE_THREAD_CMDS enables GAACE_Core's threadCommands module (TLIST, ...).
; GAACE_SCRIPT_MAX_CODE_LEN: per-slot script buffer, 4 slots default -- RAM
; isn't the constraint (hundreds of KB free), so sized generously. Delivered
; via SCRIPTAPPEND/SCRIPTCOMMIT chunking (gsc.py --upload does this
; automatically past ~200 bytes), not SCRIPTLOAD's single-call ceiling --
; see GAACE_Script's GAACEScriptRuntime.h for why those are different limits.
;
; AIN_RANGE_UNIPOLAR / AIN_RANGE_BIPOLAR (mutually exclusive): which AIN
; input divider/offset network is populated on this specific board (0-10V
; vs +/-10V) -- a hardware fact, not something firmware can detect, so it's
; a build choice. Only changes the factory-default AdcScaleM/AdcScaleB in
; src/USBrepeater.cpp; SADCM/SADCB can always override live afterward.
; First board (2026-10-27): +/-10V -- BIPOLAR set explicitly below rather
; than relying on the (currently identical) default, so this stays correct
; if a future board picks UNIPOLAR and the code's default ever changes.
build_flags =
    -D USB_TRIPLE_SERIAL
    -D GAACE_THREAD_CMDS
    -D GAACE_SCRIPT_MAX_CODE_LEN=2048
    -D AIN_RANGE_BIPOLAR

upload_protocol = teensy-cli

; USB Manufacturer/Product strings for the composite device (both ports share them).
; The teensy platform has no built-in option for these, so scripts/usb_name.py
; patches them into the Teensy core's usb_desc.h at build time from these two values.
board_vendor = GAA Custom Electronics, LLC
board_build.usb_product = USBrepeater
extra_scripts = pre:scripts/usb_name.py

lib_deps =
    https://github.com/GordonAnderson/GAACE_Core.git
    https://github.com/GordonAnderson/ArduinoThread.git
    https://github.com/GordonAnderson/GAACE_Script.git
    https://github.com/ssilverman/QNEthernet.git
